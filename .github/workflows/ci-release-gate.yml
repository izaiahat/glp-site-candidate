name: ci-release-gate

# Billing minutes were unavailable (HTTP 404, missing user scope). Keep manual:
# no PR/push trigger, no paid dispatch, no self-hosted runner registration.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: ci-release-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  short-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Python build dependencies
        run: python3 -m pip install Pillow==12.3.0
      - name: Secret scanner
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("gitleaks_8.30.1_linux_x64.tar.gz"); rows=pathlib.Path("gitleaks_8.30.1_checksums.txt").read_text().splitlines(); expected=next(x.split()[0] for x in rows if x.split()[-1]==p.name); assert hashlib.sha256(p.read_bytes()).hexdigest()==expected'
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: D1 short gate (same command on the host)
        run: bash scripts/ci-bootstrap-gate.sh
      - name: Frozen-byte Node diagnostics (not release authority)
        if: always()
        continue-on-error: true
        run: npm test
      - name: Emulation diagnostics (default-deny, nonblocking)
        if: always()
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium webkit
          PLAYWRIGHT_WORKERS=1 npm run test:browser-nowrite
