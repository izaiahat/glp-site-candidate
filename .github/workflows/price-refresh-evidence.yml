name: price-refresh-evidence
on:
  pull_request:
    paths:
      - src/price-refresh-evidence.mjs
      - src/price-state.mjs
      - tests/price-refresh-evidence.test.mjs
      - tests/helpers/price-refresh-surfaces.mjs
      - src/cost-calculator.mjs
      - src/phase3-page-graph.mjs
      - .github/workflows/price-refresh-evidence.yml
jobs:
  price-refresh-evidence-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: node --test tests/price-refresh-evidence.test.mjs
      - run: git diff --exit-code
