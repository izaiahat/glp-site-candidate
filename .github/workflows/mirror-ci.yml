name: Private mirror portable checks (build excluded)

# GLP-42 registration of mirror-ci.yml from PR #8 at
# 2927c1ea184d2ed23aa2dd448c8fc0d04df8c37d, scoped to portable checks.
# Locked dev dependencies only: lifecycle scripts and browser downloads disabled.
# Excludes npm run build, private-input checks and the post-build full npm test suite.
# Approved imagery, private registry, predecessor/rail/lastmod evidence and
# excluded owner/IndexNow keys are unavailable here. Never fabricate/upload them.
# Existing build/test logic is untouched; this is NOT a build or release PASS.
on:
  pull_request:
    paths:
      - ".github/workflows/mirror-ci.yml"
      - "assets/**"
      - "data/**"
      - "functions/go/program-manifest.js"
      - "package.json"
      - "scripts/audit-quiz-results-matrix.mjs"
      - "scripts/build-lastmod-provenance.mjs"
      - "scripts/build-staging.mjs"
      - "scripts/codemod-aeo-citation-schema.mjs"
      - "scripts/glp_evidence_ledger.mjs"
      - "scripts/glp_material_acceptance.mjs"
      - "scripts/postbuild-aeo-surface.mjs"
      - "scripts/refresh-price-tracker.mjs"
      - "scripts/refresh-therapeutic-taxonomy.py"
      - "scripts/therapeutic-taxonomy-refresh-policies.json"
      - "scripts/regenerate-go-runtime-manifest.mjs"
      - "scripts/validate-provider-fastpath-plus5.mjs"
      - "scripts/wave2-repairs.mjs"
      - "src/**"
      - "tests/accepted-guide-source.test.mjs"
      - "tests/accepted-update-source.test.mjs"
      - "tests/affiliate-relationship-sync.test.mjs"
      - "tests/candidate-export-policy.test.mjs"
      - "tests/carrier-analytics-emission.test.mjs"
      - "tests/content-upgrade-contract.test.mjs"
      - "tests/d2f-coverage-floor.test.mjs"
      - "tests/d2w-s9-source-controls.test.mjs"
      - "tests/price-index-caller-seams.test.mjs"
      - "tests/f06-fastpath-current-hold.test.mjs"
      - "tests/glp47-approved-onboarding.test.mjs"
      - "tests/guide-resource-consent.test.mjs"
      - "tests/helpers/**"
      - "tests/pricing-deployed-row-schema.test.mjs"
      - "tests/therapeutic-refresh-import.test.mjs"
      - "tests/wave2-p1-surfaces.test.mjs"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact same-repository commit to check (empty means workflow ref)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable-export-contracts:
    name: Portable export contracts (build NOT checked)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
    steps:
      - name: Require exact commit
        run: '[[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'checked_head=%s\n' "$(git rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked portable test dependencies (no lifecycle scripts or browsers)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Existing portable candidate export tests
        run: node --test tests/candidate-export-policy.test.mjs tests/paid-promo.test.mjs tests/sponsor-placement-candidate.test.mjs tests/glp327-sponsor-design-system.test.mjs tests/glp327-sponsor-layouts.test.mjs tests/glp327-sponsor-r4.test.mjs
      - name: Authenticated sponsor observer boundary fixtures (no live effects)
        run: node --experimental-test-module-mocks --test tests/glp328-payment-observer.test.mjs tests/glp327-sponsor-live-content.test.mjs
      - name: Offline sponsor packet source and exact-byte attachment contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/glp327-packet-venv"
          "$RUNNER_TEMP/glp327-packet-venv/bin/python" -m pip install reportlab==5.0.1 pypdf==6.19.0 pillow==12.3.0
          mkdir -p "$RUNNER_TEMP/glp327-packet-fixtures"
          TMPDIR="$RUNNER_TEMP/glp327-packet-fixtures" "$RUNNER_TEMP/glp327-packet-venv/bin/python" -m unittest discover -s tests -p test_glp327_sponsor_packet.py -v
      - name: Pricing manifest schema and fail-closed coverage tests
        run: node --test tests/pricing-deployed-row-schema.test.mjs tests/d2f-coverage-floor.test.mjs
      - name: Affiliate relationship synchronization contracts
        run: node --test tests/affiliate-relationship-sync.test.mjs
      - name: Guide resource renderer and privacy regression (offline only)
        run: node --test tests/guide-resource-consent.test.mjs tests/content-upgrade-contract.test.mjs tests/wave2-p1-surfaces.test.mjs
      - name: Carrier analytics emitter and alias cache regression (offline only)
        run: node --test tests/carrier-analytics-emission.test.mjs
      - name: Accepted guide source and on-page-only contract (offline)
        run: node --test tests/accepted-guide-source.test.mjs tests/accepted-update-source.test.mjs tests/accepted-guide-render-contract.test.mjs
      - name: GLP47 approved onboarding and B01 launch hold (offline only)
        run: node --test tests/glp47-approved-onboarding.test.mjs
      - name: GLP93 bounded provider append regressions (offline exact head)
        run: node --test tests/provider-price-append.test.mjs tests/provider-surface-append.test.mjs tests/provider-reviewed-score.test.mjs tests/q11-price-append-adverse.test.mjs tests/review-score-contract.test.mjs
      - name: F06 current-hold and ended-relationship validator seam (offline exact head)
        run: node --test tests/f06-fastpath-current-hold.test.mjs
      - name: Taxonomy refresh import boundary (offline exact head)
        run: node --test tests/therapeutic-refresh-import.test.mjs
      - name: Price caller dependency seam regression (synthetic inputs; not price-oracle acceptance)
        run: node --test tests/price-index-caller-seams.test.mjs
      - name: Record limited scope
        if: always()
        run: |
          printf '%s\n' 'Portable source/VM export-policy tests only; build, private-input validators and post-build full suite NOT RUN. No release authority.' >> "$GITHUB_STEP_SUMMARY"
