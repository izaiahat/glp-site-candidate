      - "tests/lastmod-declared-routes.test.mjs"
      - "tests/lastmod-fixture-analytics-binding.test.mjs"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact same-repository commit to check (empty means workflow ref)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable-export-contracts:
    name: Portable export contracts (build NOT checked)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
    steps:
      - name: Require exact commit
        run: '[[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'checked_head=%s\n' "$(git rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked portable test dependencies (no lifecycle scripts or browsers)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Existing portable candidate export tests
        run: node --test tests/candidate-export-policy.test.mjs tests/paid-promo.test.mjs tests/sponsor-placement-candidate.test.mjs tests/glp327-sponsor-design-system.test.mjs tests/glp327-sponsor-layouts.test.mjs tests/glp327-sponsor-r4.test.mjs tests/glp327-approved-public-resources.test.mjs
      - name: Authenticated sponsor observer boundary fixtures (no live effects)
        run: node --experimental-test-module-mocks --test tests/glp328-payment-observer.test.mjs tests/glp327-sponsor-live-content.test.mjs
      - name: Offline sponsor packet source and exact-byte attachment contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/glp327-packet-venv"
          "$RUNNER_TEMP/glp327-packet-venv/bin/python" -m pip install reportlab==5.0.1 pypdf==6.19.0 pillow==12.3.0
          mkdir -p "$RUNNER_TEMP/glp327-packet-fixtures"
          TMPDIR="$RUNNER_TEMP/glp327-packet-fixtures" "$RUNNER_TEMP/glp327-packet-venv/bin/python" -m unittest discover -s tests -p test_glp327_sponsor_packet.py -v
      - name: Pricing manifest schema and fail-closed coverage tests
        run: node --test tests/pricing-deployed-row-schema.test.mjs tests/d2f-coverage-floor.test.mjs
      - name: Affiliate relationship synchronization contracts
        run: node --test tests/affiliate-relationship-sync.test.mjs
      - name: Paused-offer reason custody and native outbound controls (source-only)
        run: node --test tests/paused-offer-reason-custody.test.mjs tests/affiliate-outbound-mode.test.mjs
      - name: Current selected-program denial partition (source-only; no build)
        run: node --test --test-name-pattern '^(the all-or-nothing money link map still resolves every selected program|calculator and quiz share one fail-closed transparent-direct resolver|current selected-program oracle requires complete live-or-authenticated-denied partition on every owning surface)$' tests/direct-affiliate-lane.test.mjs tests/high-intent-affiliate-surfaces.test.mjs tests/selected-program-denial-partition.test.mjs
      - name: Current provider-review holds and historical eligibility custody (source-only; no build or private approvals)
        run: node --test --test-concurrency=1 tests/current-review-holds.test.mjs tests/standalone-review-membership.test.mjs tests/paused-offer-reason-custody.test.mjs
      - name: Guide resource renderer and privacy regression (offline only)
        run: |
          node --test tests/guide-resource-consent.test.mjs tests/content-upgrade-contract.test.mjs tests/wave2-p1-surfaces.test.mjs tests/glp361-guide-resource-custody.test.mjs
          node --test tests/glp361-terms-emitter-policy.test.mjs tests/glp361-test-entrypoint.test.mjs tests/article-review-routes.test.mjs
          node --test tests/provider-append-disclosure.test.mjs tests/price-disclosure-input.test.mjs
          node --test tests/d2w-price-index-historical-registry.test.mjs
          node --test --test-name-pattern '^O-28 ' tests/pass2-late-audit-static.test.mjs
      - name: Accepted guide source and on-page-only contract (offline)
        run: node --test tests/accepted-guide-source.test.mjs tests/accepted-update-source.test.mjs tests/accepted-guide-render-contract.test.mjs
      - name: GLP47 approved onboarding and B01 launch hold (offline only)
        run: node --test tests/glp47-approved-onboarding.test.mjs
      - name: GLP93 bounded provider append regressions (offline exact head)
        run: node --test tests/provider-price-append.test.mjs tests/provider-surface-append.test.mjs tests/provider-reviewed-score.test.mjs tests/q11-price-append-adverse.test.mjs tests/review-score-contract.test.mjs
      - name: Authenticate test-only fastpath historical source closure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, base64, subprocess
          closure = {
            'e61a0017e8888570b00f4bd6c1eeef1572f421e1': ['data/program-content-ledger.json', 'data/program-registry.json', 'data/money-page-specs.json', 'data/quiz-config.json', 'data/cost-calculator.json', 'data/provider-page-contracts.json', 'data/provider-fastpath-contract.json', 'data/provider-pricing-matrix.json'],
            '9cd63e73d743d69104fa0a281ce42113743faf4a': ['src/provider-review.mjs', 'data/affiliate-activation-selection.json', 'data/affiliate-held-link-manifest.json', 'data/go-runtime-promotion-authority.json', 'functions/go/program-manifest.js', 'data/program-page-eligibility.json', 'tests/affiliate-expansion-13.test.mjs', 'src/money-page.mjs', 'src/go-render-selection.mjs', 'src/go-runtime-selection.mjs', 'src/affiliate-link-map.mjs', 'src/provider-cta-contract.mjs', 'data/money-page-specs.json', 'data/program-registry.json', 'data/identity-registry.json', 'data/affiliate-wire-in-approvals.json', 'data/approved-program-registry.json', 'data/provider-page-contracts.json', 'data/provider-fastpath-contract.json', 'data/go-selection-receipt.json', 'data/go-terms-review-ledger.json', 'data/OPERATOR-DECISION-20261001-all-pipelines-live.md', 'data/provider-cta-identity-v2.json'],
            '34db221edec1b3fbf4ae87aac67be64f75c30ca7': ['src/provider-review.mjs', 'scripts/validate-provider-fastpath-plus5.mjs'],
            '59adaddfa6800c3cd87592ad88829a081a35e3c3': ['artifacts/build4-preservation/_headers'],
          }
          env = dict(os.environ)
          auth = base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', '--filter=blob:none', 'origin', *closure], env=env, check=True)
          blobs = set()
          for ref, files in closure.items():
              rows = subprocess.check_output(['git', 'ls-tree', ref, '--', *files], text=True).splitlines()
              assert len(rows) == len(files)
              blobs.update(row.split()[2] for row in rows)
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', *sorted(blobs)], env=env, check=True)
          print('Authenticated test-only source closure:', len(closure), 'refs,', len(blobs), 'blobs; checkout unchanged')
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Carrier emitter and historical-current analytics cache oracles (source-only; no build)
        run: node --test tests/carrier-analytics-emission.test.mjs
      - name: Product-ready historical-current analytics privacy oracles (mock SDK only; no build or live exports)
        run: node --test --test-concurrency=1 tests/d2i-analytics-hygiene.test.mjs tests/product-analytics-privacy-contract.test.mjs
      - name: Fastpath current neutral-score copy and real ended renderer-validator compatibility (source-only; no build)
        run: node --test --test-name-pattern '^(provider-review specs cover|current fastpath unscored|historical unscored wording|ended fastpath review retains|real ended Pallas)' tests/provider-fastpath-plus5.test.mjs tests/fastpath-unscored-custody.test.mjs
      - name: F06 current-hold and ended-relationship validator seam (offline exact head)
        run: node --test tests/f06-fastpath-current-hold.test.mjs
      - name: Taxonomy refresh import boundary (offline exact head)
        run: node --test tests/therapeutic-refresh-import.test.mjs
      - name: Complete dynamic-profile identity census, historical capture custody and current holds (no build or evidence refresh)
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/ubuntu/business
          node tests/helpers/materialize-retatrutide-capture.mjs
          node --test --test-concurrency=1 tests/provider-dynamic-profiles.test.mjs tests/identity-calculator-census.test.mjs tests/retatrutide-capture-custody.test.mjs tests/therapeutic-wire-in-propagation-build6.test.mjs tests/therapeutic-surfaces-build6.test.mjs tests/helpers/s9-held-taxonomy-case.mjs
          node --test --test-name-pattern '^quiz policy pins AND composition, top-three order, ignored medical answers, and golden vectors$' tests/playbook.test.mjs
      - name: Accepted citation versus implementation clean-room boundary (native source-only; no build)
        run: node --max-old-space-size=256 --test tests/clean-room-citation.test.mjs
      - name: Money projection and historical-current directory membership (source-only; retained captures already authenticated above)
        run: node --max-old-space-size=256 --test --test-concurrency=1 tests/current-money-projection.test.mjs tests/historical-money-projection.test.mjs tests/current-extra-profiles.test.mjs
      - name: Price caller dependency seam regression (synthetic inputs; not price-oracle acceptance)
        run: node --test tests/price-index-caller-seams.test.mjs
      - name: Article selection dependency seam (source catalogs only; not built-output acceptance)
        run: node --test tests/article-selection-seam.test.mjs
      - name: Comparison GO assignment producer (source-only; no build or live clicks)
        run: node --test --test-concurrency=1 tests/go-comparison-assignment.test.mjs
      - name: PASS 2 quiz collection boundary and unchanged source assertions (built-output callback remains native-only)
        run: |
          node --test tests/pass2-quiz-collection.test.mjs
          node --test --test-name-pattern '^(PASS 2 quiz|Phase 4 every treatment-intent)' tests/pass2-detail-quiz.test.mjs
      - name: Build-to-quiz dependency seam (synthetic inputs; not native oracle acceptance)
        run: node --test tests/quiz-input-seam.test.mjs
      - name: GLP234 native raw-scoring and current-hold quiz regression (real source inputs only)
        run: node --test --test-name-pattern '^GLP-234 F1 actual build-to-quiz' tests/glp234-try-ageless-identity.test.mjs
      - name: GLP234 complete current eligibility and historical commercial custody (source-only; no build)
        run: |
          node --test tests/glp234-commercial-custody.test.mjs tests/f06-held-commercial-authority.test.mjs
          node --test --test-name-pattern '^GLP-234 registry projections' tests/glp234-try-ageless-identity.test.mjs
      # R11 portable coverage validates only input paths and refusal, not
      # private approval authenticity, economics or built paid-page behavior.
      - name: R11 private approval input binding (source-only; no private reads)
        run: node --test tests/r11-approval-input-binding.test.mjs
      - name: Affiliate expansion private approval input binding (source-only; no private reads)
        run: node --test tests/affiliate-expansion-approval-input.test.mjs
      - name: Motion decision input binding (source-only; no private reads or rendered checks)
        run: node --test tests/motion-decision-input-binding.test.mjs
      - name: Lastmod fixture analytics binding (source-only; no tree copies or postbuild)
        run: node --test tests/lastmod-fixture-analytics-binding.test.mjs
      # Native R2 collection needs a genuine private deployed-baseline receipt.
      # This recorder checks only maintained fixture paths/copies, not prices.
      - name: R2 retention fixture input binding (source-only; no private reads)
        run: node --test tests/retention-fixture-input-binding.test.mjs
      # Executes the complete immutable historical F17 assertion body with
      # exact committed fixture bytes; not current-registry/build acceptance.
      - name: F17 historical registry custody (source-only; no current approval)
        run: |
          node --test tests/f17-historical-registry-binding.test.mjs
          node --test --test-name-pattern '^GLP-234 F17 exact' tests/glp234-try-ageless-identity.test.mjs
      # Only the named original GLP75 historical oracle runs. Fetch four
      # shallow source trees and its exact blob closure, not full history.
      - name: GLP75 historical protected-input custody (not current approval)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          refs = ['e52b7cb903ceaa77ff8d16f958a986398cf3abda', '752572dc8bfa64e5cea2c8da7de6181dade5fbdd', 'b42a4983f1cea415328473d93b6bf57aa063532a', 'ed8deacd242647f38f029eae1ce84303b5097fca']
          files = ['data/program-registry.json', 'data/provider-page-contracts.json', 'data/phase3-pharmacy-render-input.json', 'data/affiliate-activation-selection.json', 'data/go-runtime-promotion-authority.json']
          env = dict(os.environ)
          auth = base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', '--filter=blob:none', 'origin', *refs], env=env, check=True)
          blobs = set()
          for ref in refs:
              selected = files if ref != refs[2] else files[:1]
              if ref == refs[3]: selected = files[1:]
              rows = subprocess.check_output(['git', 'ls-tree', ref, '--', *selected], text=True)
              assert len(rows.splitlines()) == len(selected)
              blobs.update(row.split()[2] for row in rows.splitlines())
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', *sorted(blobs)], env=env, check=True)
          print('Authenticated historical source closure: four refs,', len(blobs), 'distinct blobs; checkout unchanged')
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          unset GH_TOKEN
          node --test --test-name-pattern '^Wellmedr already' tests/glp75-source-bounded-seo.test.mjs
      # The immutable S9 canary is historical identity coverage, not a
      # grant for today's domains. Fetch only its real six-input Git closure.
      - name: S9 historical citation identity custody (not current approval)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          ref = 'fe0df36e273e26a994e6c75d09729295a219e6e8'
          files = ['data/program-registry.json', 'data/money-page-specs.json', 'data/program-content-ledger.json', 'data/provider-page-contracts.json', 'data/approved-program-registry.json', 'data/provider-pricing-matrix.json']
          env = dict(os.environ)
          auth = base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', '--filter=blob:none', 'origin', ref], env=env, check=True)
          rows = subprocess.check_output(['git', 'ls-tree', ref, '--', *files], text=True).splitlines()
          assert len(rows) == len(files)
          blobs = sorted({row.split()[2] for row in rows})
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', *blobs], env=env, check=True)
          print('Authenticated S9 historical source closure: one ref,', len(blobs), 'distinct blobs; checkout unchanged')
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          unset GH_TOKEN
          node --test --test-name-pattern '^(S9 citation floor|S9 every remaining|S9 held canonical|S9 real detector|the price index)' tests/d2w-s9-contract-migrations.test.mjs tests/approved-provider-link-monetization.test.mjs
      # Original >=3 minimum stays on exact historical raw inputs; today's
      # complete guide rows use current denial-only relationship authority.
      - name: Editorial historical minimum and current denial partition (source-only; no build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          ref = '9cd63e73d743d69104fa0a281ce42113743faf4a'
          files = ['data/money-page-specs.json', 'data/program-registry.json', 'data/affiliate-activation-selection.json', 'data/go-runtime-promotion-authority.json']
          env = dict(os.environ)
          auth = base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', '--filter=blob:none', 'origin', ref], env=env, check=True)
          rows = subprocess.check_output(['git', 'ls-tree', ref, '--', *files], text=True).splitlines()
          assert len(rows) == len(files)
          blobs = sorted({row.split()[2] for row in rows})
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', *blobs], env=env, check=True)
          print('Authenticated editorial raw-input closure: one ref,', len(blobs), 'blobs; checkout unchanged')
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          unset GH_TOKEN
          node --test --test-name-pattern '^(the four ruled comparison guides resolve|current ruled guides preserve|historical editorial inputs reject|current editorial oracle refuses)' tests/editorial-monetization.test.mjs tests/editorial-denial-custody.test.mjs
      - name: Current comparison relationship cohort (source-only; no served assertions)
        run: node --test --test-name-pattern '^current comparison' tests/current-comparison-cohort.test.mjs
      - name: Owned loopback fixture lifecycle (synthetic transport only; no browser or build)
        run: |
          node --test tests/review-fixture-lifecycle.test.mjs tests/review-root-input-custody.test.mjs
          env -u TMPDIR -u RUNNER_TEMP node --test tests/review-fixture-lifecycle.test.mjs
      - name: Record limited scope
        if: always()
        run: |
          printf '%s\n' 'Portable source/VM export-policy tests only; build, private-input validators and post-build full suite NOT RUN. No release authority.' >> "$GITHUB_STEP_SUMMARY"
