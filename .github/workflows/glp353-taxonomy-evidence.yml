name: GLP-353 therapeutic evidence custody
on:
  pull_request:
    paths:
      - ".github/workflows/glp353-taxonomy-evidence.yml"
      - "data/program-content-ledger.json"
      - "data/program-registry.json"
      - "data/therapeutic-taxonomy*.json"
      - "package.json"
      - "reports/ops/glp353-taxonomy-reverification-20261009/**"
      - "scripts/reconcile-therapeutic-wire-in.mjs"
      - "scripts/refresh-therapeutic-taxonomy.py"
      - "tests/test_coivas_taxonomy_refresh.py"
      - "tests/coivas-taxonomy-evidence.test.mjs"
      - "reports/ops/glp38-20260915/taxonomy-refresh/**"
      - "scripts/therapeutic-taxonomy-refresh-policies.json"
      - "src/affiliate-relationship-sync.mjs"
      - "src/citation-attribution.mjs"
      - "src/cost-calculator.mjs"
      - "src/go-promotion-contract.mjs"
      - "src/go-redirector-authority.mjs"
      - "src/go-runtime-manifest.mjs"
      - "src/medication-options.mjs"
      - "src/price-refresh-evidence.mjs"
      - "src/price-state.mjs"
      - "src/pricing-coverage-floor.mjs"
      - "src/pricing-evidence-v2.mjs"
      - "src/program-registry.mjs"
      - "src/provider-display-evidence.mjs"
      - "src/provider-dynamic-profiles.mjs"
      - "src/provider-identity.mjs"
      - "src/therapeutic-taxonomy.mjs"
      - "src/typed-price-labels.mjs"
      - "tests/glp181-taxonomy-identity.test.mjs"
      - "tests/glp353-taxonomy-reverification.test.mjs"
      - "tests/therapeutic-taxonomy-build6.test.mjs"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  taxonomy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'checked_head=%s\n' "$(git rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Coivas maintained producer regression (offline)
        run: python3 tests/test_coivas_taxonomy_refresh.py
      - name: Evidence custody, held classification, canonical identity and stale negative
        run: node --test tests/coivas-taxonomy-evidence.test.mjs tests/glp353-taxonomy-reverification.test.mjs tests/therapeutic-taxonomy-build6.test.mjs tests/glp181-taxonomy-identity.test.mjs
      - name: Native taxonomy and dynamic-profile check (no build)
        run: node scripts/reconcile-therapeutic-wire-in.mjs --release . --check
