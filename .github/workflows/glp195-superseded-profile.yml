name: GLP-195 superseded profile validation
on:
  pull_request:
    paths:
      - ".github/workflows/glp195-superseded-profile.yml"
      - "package.json"
      - "src/provider-dynamic-profiles.mjs"
      - "tests/glp195-superseded-profile.test.mjs"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  superseded-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/provider-dynamic-profiles.mjs
      - run: node --test tests/glp195-superseded-profile.test.mjs
