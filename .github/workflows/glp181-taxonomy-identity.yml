name: GLP-181 taxonomy identity
on:
  pull_request:
    paths:
      - ".github/workflows/glp181-taxonomy-identity.yml"
      - "data/program-content-ledger.json"
      - "package.json"
      - "src/affiliate-relationship-sync.mjs"
      - "src/citation-attribution.mjs"
      - "src/cost-calculator.mjs"
      - "src/go-promotion-contract.mjs"
      - "src/go-redirector-authority.mjs"
      - "src/go-runtime-manifest.mjs"
      - "src/medication-options.mjs"
      - "src/price-refresh-evidence.mjs"
      - "src/price-state.mjs"
      - "src/pricing-coverage-floor.mjs"
      - "src/pricing-evidence-v2.mjs"
      - "src/program-registry.mjs"
      - "src/provider-display-evidence.mjs"
      - "src/provider-dynamic-profiles.mjs"
      - "src/provider-identity.mjs"
      - "src/therapeutic-taxonomy.mjs"
      - "src/typed-price-labels.mjs"
      - "tests/glp181-taxonomy-identity.test.mjs"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  taxonomy-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/therapeutic-taxonomy.mjs
      - run: node --test tests/glp181-taxonomy-identity.test.mjs
